<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 3D: Torre de Densidades de Fluidos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Visual Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cannon.js Rigid Body Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #080d1a;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="text-slate-100">

    <div id="canvas-container"></div>

    <!-- HUD Overlay -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 sm:p-6">
        
        <!-- Header -->
        <div class="flex flex-wrap justify-between items-start gap-4">
            <div class="glass-panel p-4 rounded-2xl pointer-events-auto max-w-xs sm:max-w-sm shadow-2xl">
                <div class="flex items-center gap-3">
                    <div class="p-3 bg-amber-500/20 border border-amber-500/40 rounded-xl text-amber-400">
                        <i class="fa-solid fa-layer-group text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base sm:text-lg leading-tight text-white">Torre de Densidades</h1>
                        <p class="text-xs text-slate-300">Simulación Interactiva 3D</p>
                    </div>
                </div>
            </div>

            <!-- Panel de Densidades -->
            <div class="glass-panel p-4 rounded-2xl pointer-events-auto flex items-center gap-4 shadow-2xl">
                <div class="text-center px-2">
                    <p class="text-[10px] font-semibold text-amber-500 uppercase">1. Miel (Fondo)</p>
                    <p class="text-xs font-bold text-slate-200">1400 kg/m³</p>
                </div>
                <div class="h-6 w-px bg-slate-700"></div>
                <div class="text-center px-2">
                    <p class="text-[10px] font-semibold text-cyan-400 uppercase">2. Agua (Medio)</p>
                    <p class="text-xs font-bold text-slate-200">1000 kg/m³</p>
                </div>
                <div class="h-6 w-px bg-slate-700"></div>
                <div class="text-center px-2">
                    <p class="text-[10px] font-semibold text-yellow-300 uppercase">3. Aceite (Superficie)</p>
                    <p class="text-xs font-bold text-slate-200">910 kg/m³</p>
                </div>
            </div>
        </div>

        <!-- Controles -->
        <div class="flex justify-between items-end">
            <div class="hidden md:block glass-panel p-4 rounded-2xl pointer-events-auto max-w-xs shadow-2xl">
                <p class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Instrucciones</p>
                <p class="text-xs font-mono text-slate-300 leading-relaxed">
                    1. Arrastra los botes de líquidos a la boca del frasco para verterlos.<br>
                    2. Arrastra la Moneda, Tapa o Corcho dentro para comprobar su flotación.
                </p>
            </div>

            <div class="glass-panel p-5 rounded-2xl pointer-events-auto w-full md:w-80 shadow-2xl space-y-3">
                <button id="btn-reset" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 rounded-xl text-xs transition active:scale-95 shadow-lg">
                    <i class="fa-solid fa-rotate-left"></i> Vaciar y Reiniciar Todo
                </button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let world, mouseBody, mouseConstraint;
        let raycaster, mouse, dragPlane;
        let activeBody = null, isDragging = false;
        let lastMousePos = new THREE.Vector3(), mouseVelocity = new THREE.Vector3();

        const GRAVITY = 9.81;
        const BEAKER_RADIUS = 2.2;
        const BEAKER_HEIGHT = 6.4;
        const TABLE_Y = -3.2;

        let addedFluids = [];
        let liquidMeshes = [];
        let physicalItems = [];

        const FLUID_SPECS = [
            { id: 'miel', name: "MIEL", color: 0xc97a00, opacity: 0.70, density: 1400, startX: -4.8 },
            { id: 'agua', name: "AGUA", color: 0x0284c7, opacity: 0.50, density: 1000, startX: -3.0 },
            { id: 'aceite', name: "ACEITE", color: 0xeab308, opacity: 0.60, density: 910, startX: 4.5 }
        ];

        function createLabelCanvas(text, bgColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(0, 0, 256, 64, 16);
            ctx.fill();

            ctx.font = 'Bold 28px Inter, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(1.4, 0.35, 1);
            return sprite;
        }

        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080d1a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 14.0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const OrbitControlsClass = THREE.OrbitControls || window.OrbitControls;
            controls = new OrbitControlsClass(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 1.1));
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.3);
            mainLight.position.set(6, 12, 8);
            mainLight.castShadow = true;
            scene.add(mainLight);

            const dragPlaneGeo = new THREE.PlaneGeometry(300, 300);
            const dragPlaneMat = new THREE.MeshBasicMaterial({ visible: false });
            dragPlane = new THREE.Mesh(dragPlaneGeo, dragPlaneMat);
            scene.add(dragPlane);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
        }

        function initPhysicsWorld() {
            world = new CANNON.World();
            world.gravity.set(0, -GRAVITY, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 12;

            // Materiales de fricción para rodamiento natural
            const groundMat = new CANNON.Material('ground');
            const bottleMat = new CANNON.Material('bottle');
            const contactMat = new CANNON.ContactMaterial(groundMat, bottleMat, {
                friction: 0.4,
                restitution: 0.25
            });
            world.addContactMaterial(contactMat);

            // Plano Sólido de la Mesa
            const tableShape = new CANNON.Plane();
            const tableBody = new CANNON.Body({ mass: 0, material: groundMat });
            tableBody.addShape(tableShape);
            tableBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            tableBody.position.set(0, TABLE_Y, 0);
            world.addBody(tableBody);

            mouseBody = new CANNON.Body({ mass: 0 });
            mouseBody.collisionFilterGroup = 0;
            mouseBody.collisionFilterMask = 0;
            world.addBody(mouseBody);

            // Anillo de colisión para la probeta
            const numPillars = 12;
            for (let i = 0; i < numPillars; i++) {
                const angle = (i / numPillars) * Math.PI * 2;
                const pillar = new CANNON.Body({ mass: 0 });
                pillar.addShape(new CANNON.Cylinder(0.12, 0.12, BEAKER_HEIGHT, 8));
                const px = Math.cos(angle) * (BEAKER_RADIUS - 0.05);
                const pz = Math.sin(angle) * (BEAKER_RADIUS - 0.05);
                pillar.position.set(px, TABLE_Y + BEAKER_HEIGHT / 2, pz);
                world.addBody(pillar);
            }
        }

        function buildSceneObjects() {
            // Mesa Sólida Visual
            const tableGeo = new THREE.CylinderGeometry(15, 15, 0.4, 64);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.35 });
            const tableMesh = new THREE.Mesh(tableGeo, tableMat);
            tableMesh.position.y = TABLE_Y - 0.2;
            tableMesh.receiveShadow = true;
            scene.add(tableMesh);

            // Probeta de cristal
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, transparent: true, opacity: 0.20, roughness: 0.05, transmission: 0.90, side: THREE.DoubleSide
            });
            const cylinderGeo = new THREE.CylinderGeometry(BEAKER_RADIUS, BEAKER_RADIUS, BEAKER_HEIGHT, 48, 1, true);
            const glassCylinder = new THREE.Mesh(cylinderGeo, glassMat);
            glassCylinder.position.y = TABLE_Y + (BEAKER_HEIGHT / 2);
            glassCylinder.renderOrder = 10;
            scene.add(glassCylinder);

            spawnBottles();
            spawnObjects();
        }

        function spawnBottles() {
            FLUID_SPECS.forEach(spec => {
                const bottleGroup = new THREE.Group();

                const bodyGeo = new THREE.CylinderGeometry(0.48, 0.48, 1.4, 24);
                const bodyMat = new THREE.MeshStandardMaterial({ color: spec.color, roughness: 0.25 });
                const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
                bodyMesh.position.y = 0.7;

                const neckGeo = new THREE.CylinderGeometry(0.18, 0.22, 0.4, 16);
                const neckMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
                const neckMesh = new THREE.Mesh(neckGeo, neckMat);
                neckMesh.position.y = 1.6;

                const label = createLabelCanvas(spec.name, '#0f172a');
                label.position.set(0, 2.3, 0);

                bottleGroup.add(bodyMesh);
                bottleGroup.add(neckMesh);
                bottleGroup.add(label);
                scene.add(bottleGroup);

                // Cuerpos de frasco configurados para rodar dinámicamente según lanzamiento
                const bottleShape = new CANNON.Cylinder(0.48, 0.48, 1.4, 16);
                const bottleBody = new CANNON.Body({
                    mass: 1.2,
                    linearDamping: 0.15,
                    angularDamping: 0.35
                });
                bottleBody.addShape(bottleShape);
                bottleBody.position.set(spec.startX, TABLE_Y + 0.7, 0);
                world.addBody(bottleBody);

                physicalItems.push({
                    mesh: bottleGroup,
                    body: bottleBody,
                    type: 'bottle',
                    spec: spec
                });
            });
        }

        function spawnObjects() {
            const configs = [
                { name: 'MONEDA', density: 7800, color: 0xd97706, startX: -1.8, labelBg: '#b45309', shape: new CANNON.Cylinder(0.35, 0.35, 0.1, 16), geo: new THREE.CylinderGeometry(0.35, 0.35, 0.1, 32) },
                { name: 'TAPA', density: 950, color: 0xd97706, startX: 0, labelBg: '#dc2626', shape: new CANNON.Cylinder(0.35, 0.35, 0.18, 16), geo: new THREE.CylinderGeometry(0.35, 0.35, 0.18, 32) },
                { name: 'CORCHO', density: 240, color: 0xd97706, startX: 1.8, labelBg: '#b45309', shape: new CANNON.Cylinder(0.35, 0.3, 0.4, 16), geo: new THREE.CylinderGeometry(0.35, 0.3, 0.4, 24) }
            ];

            configs.forEach(cfg => {
                const group = new THREE.Group();
                const mat = new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.3 });
                const mesh = new THREE.Mesh(cfg.geo, mat);
                const label = createLabelCanvas(cfg.name, cfg.labelBg);
                label.position.set(0, 0.6, 0);

                group.add(mesh);
                group.add(label);
                scene.add(group);

                const body = new CANNON.Body({
                    mass: 0.5,
                    linearDamping: 0.25,
                    angularDamping: 0.4
                });
                body.addShape(cfg.shape);
                body.position.set(cfg.startX, TABLE_Y + 0.2, 2.5);
                world.addBody(body);

                physicalItems.push({
                    mesh: group,
                    body: body,
                    type: 'object',
                    name: cfg.name,
                    density: cfg.density
                });
            });
        }

        function pourFluid(spec) {
            if (addedFluids.some(f => f.id === spec.id)) return;

            addedFluids.push(spec);
            addedFluids.sort((a, b) => b.density - a.density);

            renderFluidLayers();
        }

        function renderFluidLayers() {
            liquidMeshes.forEach(m => scene.remove(m));
            liquidMeshes = [];

            if (addedFluids.length === 0) return;

            const totalHeight = BEAKER_HEIGHT * 0.82;
            const layerHeight = totalHeight / addedFluids.length;

            addedFluids.forEach((spec, index) => {
                const geo = new THREE.CylinderGeometry(BEAKER_RADIUS - 0.08, BEAKER_RADIUS - 0.08, layerHeight, 32);
                const mat = new THREE.MeshPhongMaterial({
                    color: spec.color,
                    transparent: true,
                    opacity: spec.opacity,
                    shininess: 40,
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(geo, mat);
                
                const yPos = TABLE_Y + (layerHeight / 2) + (index * layerHeight);
                mesh.position.set(0, yPos, 0);
                mesh.renderOrder = index + 1;

                scene.add(mesh);
                liquidMeshes.push(mesh);
            });
        }

        function applyHydrodynamics() {
            if (addedFluids.length === 0) return;

            const totalHeight = BEAKER_HEIGHT * 0.82;
            const layerHeight = totalHeight / addedFluids.length;

            physicalItems.filter(item => item.type === 'object').forEach(item => {
                const pos = item.body.position;
                const distToCenter = Math.sqrt(pos.x * pos.x + pos.z * pos.z);

                if (distToCenter < BEAKER_RADIUS - 0.1 && pos.y < TABLE_Y + totalHeight) {
                    let ambientDensity = 1000;
                    for (let i = 0; i < addedFluids.length; i++) {
                        const layerTopY = TABLE_Y + ((i + 1) * layerHeight);
                        if (pos.y <= layerTopY) {
                            ambientDensity = addedFluids[i].density;
                            break;
                        }
                    }

                    if (item.density < ambientDensity) {
                        const buoyantForce = new CANNON.Vec3(0, GRAVITY * item.body.mass * 1.4, 0);
                        item.body.applyForce(buoyantForce, pos);
                        item.body.velocity.scale(0.85, item.body.velocity);
                    } else {
                        item.body.velocity.y *= 0.88;
                    }
                }
            });
        }

        function setupPointerControls() {
            const canvas = renderer.domElement;

            function updatePointer(e) {
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            }

            canvas.addEventListener('pointerdown', (e) => {
                updatePointer(e);
                raycaster.setFromCamera(mouse, camera);

                let hits = [];
                physicalItems.forEach(item => {
                    const intersect = raycaster.intersectObjects(item.mesh.children, true);
                    if (intersect.length > 0) {
                        hits.push({ item: item, point: intersect[0].point });
                    }
                });

                if (hits.length > 0) {
                    activeBody = hits[0].item;
                    isDragging = true;
                    controls.enabled = false;

                    dragPlane.position.copy(activeBody.mesh.position);
                    dragPlane.quaternion.copy(camera.quaternion);

                    mouseBody.position.copy(activeBody.body.position);
                    lastMousePos.copy(activeBody.body.position);

                    const stiffness = activeBody.type === 'bottle' ? 300 : 1e4;
                    mouseConstraint = new CANNON.PointToPointConstraint(
                        activeBody.body, new CANNON.Vec3(0, 0, 0),
                        mouseBody, new CANNON.Vec3(0, 0, 0),
                        stiffness
                    );
                    world.addConstraint(mouseConstraint);
                    activeBody.body.wakeUp();
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDragging || !activeBody) return;
                updatePointer(e);
                raycaster.setFromCamera(mouse, camera);

                const hits = raycaster.intersectObject(dragPlane);
                if (hits.length > 0) {
                    const target = hits[0].point;
                    const minY = activeBody.type === 'bottle' ? TABLE_Y + 0.7 : TABLE_Y + 0.2;
                    
                    const newPos = new THREE.Vector3(
                        Math.max(-6.5, Math.min(6.5, target.x)),
                        Math.max(minY, Math.min(5.5, target.y)),
                        Math.max(-4, Math.min(4, target.z))
                    );

                    mouseVelocity.subVectors(newPos, lastMousePos).multiplyScalar(15);
                    lastMousePos.copy(newPos);

                    mouseBody.position.copy(newPos);
                    mouseBody.wakeUp();

                    if (activeBody.type === 'bottle') {
                        const distToProbeta = Math.sqrt(activeBody.body.position.x * activeBody.body.position.x + activeBody.body.position.z * activeBody.body.position.z);
                        if (distToProbeta < BEAKER_RADIUS + 0.8 && activeBody.body.position.y > TABLE_Y + 2.0) {
                            pourFluid(activeBody.spec);
                        }
                    }
                }
            });

            const release = () => {
                if (isDragging) {
                    isDragging = false;
                    controls.enabled = true;
                    if (mouseConstraint) {
                        world.removeConstraint(mouseConstraint);
                        mouseConstraint = null;
                    }
                    if (activeBody) {
                        // Transferir impulso de velocidad al soltar para que el bote caiga y ruede naturalmente
                        if (activeBody.type === 'bottle') {
                            activeBody.body.velocity.set(mouseVelocity.x, mouseVelocity.y, mouseVelocity.z);
                            activeBody.body.angularVelocity.set(
                                (Math.random() - 0.5) * 3,
                                (Math.random() - 0.5) * 3,
                                (Math.random() - 0.5) * 3
                            );
                        }
                        activeBody.body.wakeUp();
                        activeBody = null;
                    }
                }
            };

            canvas.addEventListener('pointerup', release);
            canvas.addEventListener('pointercancel', release);

            document.getElementById('btn-reset').onclick = () => {
                addedFluids = [];
                renderFluidLayers();

                physicalItems.forEach(item => {
                    if (item.type === 'bottle') {
                        item.body.position.set(item.spec.startX, TABLE_Y + 0.7, 0);
                    } else {
                        const startX = item.name === 'MONEDA' ? -1.8 : item.name === 'TAPA' ? 0 : 1.8;
                        item.body.position.set(startX, TABLE_Y + 0.2, 2.5);
                    }
                    item.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), 0);
                    item.body.velocity.set(0, 0, 0);
                    item.body.angularVelocity.set(0, 0, 0);
                });
            };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        function renderLoop() {
            requestAnimationFrame(renderLoop);

            const delta = Math.min(clock.getDelta(), 0.1);
            world.step(1 / 60, delta, 3);

            // BARRERA DE MESA INFRANQUEABLE
            physicalItems.forEach(item => {
                const minY = item.type === 'bottle' ? TABLE_Y + 0.7 : TABLE_Y + 0.2;
                if (item.body.position.y < minY) {
                    item.body.position.y = minY;
                    item.body.velocity.y = Math.max(0, item.body.velocity.y);
                }
            });

            applyHydrodynamics();

            physicalItems.forEach(item => {
                item.mesh.position.copy(item.body.position);
                item.mesh.quaternion.copy(item.body.quaternion);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            initScene();
            initPhysicsWorld();
            buildSceneObjects();
            setupPointerControls();
            window.addEventListener('resize', onWindowResize);
            renderLoop();
        };
    </script>
</body>
</html>
