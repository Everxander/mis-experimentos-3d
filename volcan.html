<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 3D: Volcán de Bicarbonato y Vinagre</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js CDN seguro -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls compatible r128 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0b0f19;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="text-slate-100">

    <div id="canvas-container"></div>

    <!-- HUD Overlay -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 sm:p-6">
        
        <!-- Header & Telemetría -->
        <div class="flex flex-wrap justify-between items-start gap-4">
            <div class="glass-panel p-4 rounded-2xl pointer-events-auto max-w-xs shadow-2xl">
                <div class="flex items-center gap-3">
                    <div class="p-3 bg-red-500/20 border border-red-500/40 rounded-xl text-red-400">
                        <i class="fa-solid fa-volcano text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base sm:text-lg leading-tight text-white">Volcán Químico 3D</h1>
                        <p class="text-xs text-slate-300">NaHCO₃ + CH₃COOH</p>
                    </div>
                </div>
            </div>

            <!-- Indicadores -->
            <div class="glass-panel p-4 rounded-2xl pointer-events-auto flex items-center gap-4 sm:gap-6 shadow-2xl">
                <div class="text-center">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase">Bicarbonato</p>
                    <p id="bicarb-display" class="text-sm sm:text-base font-bold text-amber-400">0 <span class="text-xs text-slate-300">g</span></p>
                </div>
                <div class="h-8 w-px bg-slate-700"></div>
                <div class="text-center">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase">Vinagre</p>
                    <p id="vinegar-display" class="text-sm sm:text-base font-bold text-cyan-400">0 <span class="text-xs text-slate-300">ml</span></p>
                </div>
                <div class="h-8 w-px bg-slate-700"></div>
                <div class="text-center">
                    <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase">Estado</p>
                    <p id="status-display" class="text-xs font-bold text-emerald-300 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-1 rounded-lg">Cráter Vacío</p>
                </div>
            </div>
        </div>

        <!-- Panel Inferior de Controles -->
        <div class="flex justify-between items-end">
            <div class="hidden md:block glass-panel p-4 rounded-2xl pointer-events-auto max-w-xs shadow-2xl">
                <p class="text-xs font-bold text-slate-300 uppercase mb-2">Reacción Química en Proceso</p>
                <p id="chem-formula" class="text-xs font-mono text-slate-400 leading-relaxed">
                    Añade Bicarbonato (Base) y Vinagre (Ácido) para liberar CO₂ y crear espuma efervescente.
                </p>
            </div>

            <div class="glass-panel p-5 rounded-2xl pointer-events-auto w-full md:w-80 shadow-2xl space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-add-bicarb" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5 active:scale-95">
                        <i class="fa-solid fa-spoon"></i> + Bicarbonato
                    </button>
                    <button id="btn-add-vinegar" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5 active:scale-95">
                        <i class="fa-solid fa-flask"></i> + Vinagre
                    </button>
                </div>

                <div class="flex gap-2 items-center justify-between">
                    <span class="text-xs text-slate-400 font-semibold">Color Lava:</span>
                    <div class="flex gap-1.5">
                        <button id="btn-color-red" class="w-6 h-6 rounded-full bg-red-600 border border-white/40 active:scale-95"></button>
                        <button id="btn-color-orange" class="w-6 h-6 rounded-full bg-orange-500 border border-white/40 active:scale-95"></button>
                        <button id="btn-color-purple" class="w-6 h-6 rounded-full bg-purple-600 border border-white/40 active:scale-95"></button>
                        <button id="btn-color-green" class="w-6 h-6 rounded-full bg-emerald-400 border border-white/40 active:scale-95"></button>
                    </div>
                </div>

                <button id="btn-reset" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2 rounded-xl text-xs transition active:scale-95">
                    <i class="fa-solid fa-rotate-left"></i> Limpiar Cráter
                </button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let lavaParticles = [], particleGroup;
        let bicarbGrams = 0, vinegarMl = 0;
        let reactionIntensity = 0;
        let currentLavaColor = 0xff3300;
        let craterMesh, liquidMesh;

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.025);

            // 2. Cámara
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 11);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls con Three.OrbitControls seguro
            const OrbitControlsClass = THREE.OrbitControls || window.OrbitControls;
            controls = new OrbitControlsClass(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 4;
            controls.maxDistance = 20;

            // 5. Iluminación
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
            sun.position.set(8, 15, 6);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            const craterLight = new THREE.PointLight(currentLavaColor, 1.5, 6);
            craterLight.position.set(0, 1.8, 0);
            scene.add(craterLight);

            // 6. Construir Volcán 3D
            buildVolcano();

            particleGroup = new THREE.Group();
            scene.add(particleGroup);

            window.addEventListener('resize', onWindowResize);
            setupUI();
            animate();
        }

        function buildVolcano() {
            // Mesa / Suelo
            const tableGeo = new THREE.CylinderGeometry(8, 8, 0.4, 64);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
            const table = new THREE.Mesh(tableGeo, tableMat);
            table.position.y = -2.2;
            table.receiveShadow = true;
            scene.add(table);

            // Cuerpo principal del volcán
            const volcanoGeo = new THREE.ConeGeometry(3.6, 4.0, 32, 1, true);
            const volcanoMat = new THREE.MeshStandardMaterial({
                color: 0x3d2817,
                roughness: 0.9,
                metalness: 0.1,
                flatShading: true
            });
            const volcano = new THREE.Mesh(volcanoGeo, volcanoMat);
            volcano.position.y = -0.2;
            volcano.castShadow = true;
            volcano.receiveShadow = true;
            scene.add(volcano);

            // Interior del cráter
            const craterGeo = new THREE.CylinderGeometry(0.85, 0.6, 1.8, 24);
            const craterMat = new THREE.MeshStandardMaterial({ color: 0x1f140e, roughness: 0.95 });
            craterMesh = new THREE.Mesh(craterGeo, craterMat);
            craterMesh.position.y = 1.0;
            scene.add(craterMesh);

            // Líquido reactivo en el fondo del cráter
            const liquidGeo = new THREE.CylinderGeometry(0.7, 0.55, 0.2, 24);
            const liquidMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                roughness: 0.2
            });
            liquidMesh = new THREE.Mesh(liquidGeo, liquidMat);
            liquidMesh.position.y = 0.3;
            scene.add(liquidMesh);
        }

        function triggerEruption() {
            if (bicarbGrams > 0 && vinegarMl > 0) {
                reactionIntensity = Math.min(1.0, (bicarbGrams * vinegarMl) / 2500);
            }
        }

        function spawnLavaParticle() {
            const size = 0.08 + Math.random() * 0.14;
            const geo = new THREE.SphereGeometry(size, 8, 8);
            const mat = new THREE.MeshStandardMaterial({
                color: currentLavaColor,
                emissive: currentLavaColor,
                emissiveIntensity: 0.6,
                roughness: 0.3,
                transparent: true,
                opacity: 0.95
            });
            const p = new THREE.Mesh(geo, mat);

            // Generar desde el centro del cráter
            p.position.set(
                (Math.random() - 0.5) * 0.7,
                1.7,
                (Math.random() - 0.5) * 0.7
            );

            p.userData = {
                vx: (Math.random() - 0.5) * (0.04 + reactionIntensity * 0.1),
                vy: 0.06 + reactionIntensity * 0.18 + Math.random() * 0.04,
                vz: (Math.random() - 0.5) * (0.04 + reactionIntensity * 0.1),
                life: 1.0
            };

            particleGroup.add(p);
            lavaParticles.push(p);
        }

        function updateParticles() {
            if (reactionIntensity > 0) {
                const spawnRate = Math.floor(reactionIntensity * 10) + 1;
                for (let i = 0; i < spawnRate; i++) {
                    spawnLavaParticle();
                }
                reactionIntensity -= 0.0025;
                if (reactionIntensity < 0) reactionIntensity = 0;
            }

            for (let i = lavaParticles.length - 1; i >= 0; i--) {
                const p = lavaParticles[i];
                p.position.x += p.userData.vx;
                p.position.y += p.userData.vy;
                p.position.z += p.userData.vz;

                p.userData.vy -= 0.004; // Gravedad
                p.userData.life -= 0.012;
                p.material.opacity = Math.max(0, p.userData.life);

                if (p.userData.life <= 0 || p.position.y < -2.0) {
                    particleGroup.remove(p);
                    lavaParticles.splice(i, 1);
                }
            }
        }

        function setupUI() {
            const bicarbDisp = document.getElementById('bicarb-display');
            const vinegarDisp = document.getElementById('vinegar-display');
            const statusDisp = document.getElementById('status-display');

            document.getElementById('btn-add-bicarb').addEventListener('click', () => {
                bicarbGrams += 15;
                bicarbDisp.innerHTML = `${bicarbGrams} <span class="text-xs text-slate-300">g</span>`;
                triggerEruption();
                updateStatus();
            });

            document.getElementById('btn-add-vinegar').addEventListener('click', () => {
                vinegarMl += 50;
                vinegarDisp.innerHTML = `${vinegarMl} <span class="text-xs text-slate-300">ml</span>`;
                triggerEruption();
                updateStatus();
            });

            document.getElementById('btn-color-red').onclick = () => currentLavaColor = 0xff3300;
            document.getElementById('btn-color-orange').onclick = () => currentLavaColor = 0xff8800;
            document.getElementById('btn-color-purple').onclick = () => currentLavaColor = 0xaa00ff;
            document.getElementById('btn-color-green').onclick = () => currentLavaColor = 0x00ff88;

            document.getElementById('btn-reset').addEventListener('click', () => {
                bicarbGrams = 0;
                vinegarMl = 0;
                reactionIntensity = 0;
                bicarbDisp.innerHTML = `0 <span class="text-xs text-slate-300">g</span>`;
                vinegarDisp.innerHTML = `0 <span class="text-xs text-slate-300">ml</span>`;
                updateStatus();
            });

            function updateStatus() {
                if (reactionIntensity > 0.05) {
                    statusDisp.innerText = '¡ERUPCIÓN EN PROCESO!';
                    statusDisp.className = 'text-xs font-bold text-red-300 bg-red-950/80 border border-red-500/50 px-2.5 py-1 rounded-lg animate-pulse';
                } else if (bicarbGrams > 0 && vinegarMl === 0) {
                    statusDisp.innerText = 'Falta Vinagre';
                    statusDisp.className = 'text-xs font-bold text-amber-300 bg-amber-950/60 border border-amber-500/30 px-2.5 py-1 rounded-lg';
                } else if (bicarbGrams === 0 && vinegarMl > 0) {
                    statusDisp.innerText = 'Falta Bicarbonato';
                    statusDisp.className = 'text-xs font-bold text-cyan-300 bg-cyan-950/60 border border-cyan-500/30 px-2.5 py-1 rounded-lg';
                } else {
                    statusDisp.innerText = 'Cráter Vacío';
                    statusDisp.className = 'text-xs font-bold text-emerald-300 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-1 rounded-lg';
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateParticles();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
